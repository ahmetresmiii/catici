```html
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deniz Gitar Superstar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Permanent+Marker&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            overflow-x: hidden;
            touch-action: manipulation;
        }
        .rock-font { font-family: 'Permanent Marker', cursive; }
        .title-font {
            font-family: 'Bangers', system-ui;
            text-shadow: 4px 4px 0px #ff0055;
        }
        .video-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 100;
            justify-content: center; align-items: center;
        }
        .glow { box-shadow: 0 0 20px rgba(255, 0, 85, 0.6); }
        .floating { animation: floating 3s ease-in-out infinite; }
        @keyframes floating {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4" onclick="handleGlobalClick()">

    <!-- Arka Plan Müziği -->
    <audio id="bgMusic" loop>
        <source src="metallica.mp3" type="audio/mpeg">
    </audio>

    <header class="text-center mt-10">
        <h1 class="text-5xl md:text-7xl title-font mb-4 floating">DENİZ GİTAR ÇALIYOR!</h1>
        <p class="text-xl md:text-2xl rock-font text-yellow-400">Şu yakışıklılığa bir baksanıza...</p>
    </header>

    <main class="flex-grow flex flex-col items-center justify-center text-center space-y-8">
        <div class="relative group">
            <div class="absolute -inset-1 bg-gradient-to-r from-pink-600 to-yellow-500 rounded-full blur opacity-75 group-hover:opacity-100 transition duration-1000"></div>
            <div class="relative px-8 py-8 bg-black rounded-full flex items-center">
                <span class="text-6xl md:text-8xl">🎸</span>
            </div>
        </div>
        
        <div class="bg-white/10 backdrop-blur-md p-6 rounded-2xl border border-white/20 max-w-sm glow">
            <p id="statusText" class="text-pink-500 font-bold animate-bounce">
                Ekrana Dokun ve Konseri Başlat! 🤘
            </p>
        </div>
    </main>

    <div id="videoOverlay" class="video-overlay" onclick="closeVideo(event)">
        <div class="relative w-full max-w-2xl px-4">
            <button class="absolute -top-12 right-4 text-white text-4xl" onclick="closeVideo(event)">&times;</button>
            <video id="denizVideo" class="w-full rounded-lg shadow-2xl border-2 border-pink-500" controls>
                Tarayıcınız video desteklemiyor.
            </video>
        </div>
    </div>

    <footer class="w-full text-center py-6 border-t border-white/10 mt-10">
        <p class="rock-font text-sm opacity-80">yapimci canim oglusum deniz</p>
    </footer>

    <script>
        const videoPlayer = document.getElementById('denizVideo');
        const overlay = document.getElementById('videoOverlay');
        const bgMusic = document.getElementById('bgMusic');
        const statusText = document.getElementById('statusText');
        
        let isFirstClick = true;
        const videos = ['deniz1.mp4', 'deniz2.mp4', 'deniz3.mp4'];

        function handleGlobalClick() {
            if (isFirstClick) {
                bgMusic.play().catch(() => {});
                isFirstClick = false;
                statusText.innerText = "Şimdi Tekrar Dokun ve Deniz'i İzle! 🔥";
                return;
            }
            if (overlay.style.display === 'flex') return;
            playRandomVideo();
        }

        function playRandomVideo() {
            bgMusic.pause();
            const randomIdx = Math.floor(Math.random() * videos.length);
            videoPlayer.src = videos[randomIdx]; 
            overlay.style.display = 'flex';
            videoPlayer.play().catch(() => {});
        }

        function closeVideo(event) {
            event.stopPropagation();
            overlay.style.display = 'none';
            videoPlayer.pause();
            bgMusic.play().catch(() => {});
        }
    </script>
</body>
</html>
