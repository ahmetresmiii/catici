```html
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deniz Gitar Superstar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Permanent+Marker&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            overflow-x: hidden;
            touch-action: manipulation;
        }
        .rock-font { font-family: 'Permanent Marker', cursive; }
        .title-font {
            font-family: 'Bangers', system-ui;
            text-shadow: 4px 4px 0px #ff0055;
        }
        .video-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 100;
            justify-content: center; align-items: center;
        }
        .glow { box-shadow: 0 0 20px rgba(255, 0, 85, 0.6); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4" onclick="handleInteraction()">

    <!-- Arka Plan Muzigi -->
    <audio id="bgMusic" loop>
        <source src="metallica.mp3" type="audio/mpeg">
    </audio>

    <header class="text-center mt-10">
        <h1 class="text-5xl md:text-7xl title-font mb-4">DENİZ GİTAR ÇALIYOR!</h1>
        <p class="text-xl md:text-2xl rock-font text-yellow-400">Şu yakışıklılığa bir baksanıza...</p>
    </header>

    <main class="flex-grow flex flex-col items-center justify-center text-center space-y-8">
        <div class="relative px-8 py-8 bg-black rounded-full glow">
            <span class="text-6xl md:text-8xl">🎸</span>
        </div>
        
        <div class="bg-white/10 backdrop-blur-md p-6 rounded-2xl border border-white/20">
            <p id="statusText" class="text-pink-500 font-bold animate-pulse text-xl">
                MÜZİK İÇİN EKRANA DOKUN! 🤘(1.DOKUNUŞ METALLİCA 2.DOKUNUŞ DENİZ)
            </p>
        </div>
    </main>

    <div id="videoOverlay" class="video-overlay">
        <div class="relative w-full max-w-2xl px-4">
            <button class="absolute -top-12 right-4 text-white text-4xl" onclick="closeVideo(event)">&times;</button>
            <video id="denizVideo" class="w-full rounded-lg shadow-2xl border-2 border-pink-500" controls>
                Tarayiciniz video desteklemiyor.
            </video>
        </div>
    </div>

    <footer class="w-full text-center py-6 border-t border-white/10 mt-10">
        <p class="rock-font text-sm opacity-80">yapimci canim oglusum deniz</p>
    </footer>

    <script>
        const videoPlayer = document.getElementById('denizVideo');
        const overlay = document.getElementById('videoOverlay');
        const bgMusic = document.getElementById('bgMusic');
        const statusText = document.getElementById('statusText');
        
        let musicStarted = false;
        const videos = ['deniz1.mp4', 'deniz2.mp4', 'deniz3.mp4'];

        function handleInteraction() {
            // Eger video aciksa tiklamayi baska yere yorma
            if (overlay.style.display === 'flex') return;

            // Ilk tiklamada muzigi baslat
            if (!musicStarted) {
                bgMusic.play().then(() => {
                    musicStarted = true;
                    statusText.innerText = "DENİZ'İ İZLEMEK İÇİN TEKRAR DOKUN! 🔥";
                }).catch(e => console.log("Muzik engellendi:", e));
            } else {
                // Sonraki her tiklamada rastgele video
                playRandomVideo();
            }
        }

        function playRandomVideo() {
            bgMusic.pause();
            const randomIdx = Math.floor(Math.random() * videos.length);
            videoPlayer.src = videos[randomIdx]; 
            overlay.style.display = 'flex';
            videoPlayer.play().catch(e => console.log("Video hatasi:", e));
        }

        function closeVideo(event) {
            event.stopPropagation();
            overlay.style.display = 'none';
            videoPlayer.pause();
            videoPlayer.currentTime = 0;
            // Deniz susunca Metallica devam
            bgMusic.play();
        }
    </script>
</body>
</html>
