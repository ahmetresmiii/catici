```html
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deniz Gitar Superstar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Permanent+Marker&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            color: white;
            overflow-x: hidden;
            touch-action: manipulation;
        }
        .rock-font { font-family: 'Permanent Marker', cursive; }
        .title-font {
            font-family: 'Bangers', system-ui;
            text-shadow: 4px 4px 0px #ff0055;
        }
        .video-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 100;
            justify-content: center; align-items: center;
        }
        .btn-rock {
            transition: all 0.3s ease;
            box-shadow: 0 4px 0 #880e4f;
        }
        .btn-rock:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #880e4f;
        }
        .glow-effect {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 0, 85, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(255, 0, 85, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 0, 85, 0); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4" onclick="handleScreenClick(event)">

    <!-- Metallica Muzigi -->
    <audio id="bgMusic" loop>
        <source src="metallica.mp3" type="audio/mpeg">
    </audio>

    <header class="text-center mt-6 select-none">
        <h1 class="text-5xl md:text-8xl title-font mb-4 tracking-wider">DENİZ GİTAR STARI</h1>
        <p class="text-xl md:text-3xl rock-font text-yellow-400">Karizma Şimdi Daha Da Arttı!</p>
    </header>

    <main class="flex-grow flex flex-col items-center justify-center gap-8 w-full max-w-md">
        
        <!-- Metallica Kontrolu -->
        <button onclick="toggleMetallica(event)" class="btn-rock w-full bg-red-700 hover:bg-red-600 p-6 rounded-xl border-2 border-white flex items-center justify-center gap-4 group">
            <span class="text-4xl group-hover:scale-125 transition-transform">🤘</span>
            <span class="text-2xl font-bold uppercase tracking-tighter title-font" id="metaBtnText">METALLICA BAŞLAT</span>
        </button>

        <!-- Deniz Butonu -->
        <button onclick="playRandomVideo(event)" class="btn-rock w-full bg-pink-600 hover:bg-pink-500 p-6 rounded-xl border-2 border-white flex items-center justify-center gap-4 glow-effect group">
            <span class="text-4xl group-hover:rotate-12 transition-transform">🎸</span>
            <span class="text-2xl font-bold uppercase tracking-tighter title-font">DENİZ'İ İZLE (YENİ!)</span>
        </button>

        <div class="bg-black/40 backdrop-blur-sm p-4 rounded-lg border border-white/10 text-center select-none">
            <p class="text-sm opacity-70 italic">Ekranın herhangi bir yerine dokunarak şovun tadını çıkar!</p>
        </div>

    </main>

    <!-- Video Modal -->
    <div id="videoOverlay" class="video-overlay" onclick="closeVideo(event)">
        <div class="relative w-full max-w-2xl px-4" onclick="event.stopPropagation()">
            <button class="absolute -top-12 right-4 text-white text-5xl hover:text-pink-500 transition-colors" onclick="closeVideo(event)">&times;</button>
            <video id="denizVideo" class="w-full rounded-2xl shadow-2xl border-4 border-pink-500 bg-black" controls>
                Tarayiciniz video desteklemiyor.
            </video>
        </div>
    </div>

    <footer class="w-full text-center py-4 border-t border-white/10">
        <p class="rock-font text-lg opacity-90">yapimci canim oglusum deniz</p>
    </footer>

    <script>
        const videoPlayer = document.getElementById('denizVideo');
        const overlay = document.getElementById('videoOverlay');
        const bgMusic = document.getElementById('bgMusic');
        const metaBtnText = document.getElementById('metaBtnText');
        
        // Guncellenmis video listesi
        const videos = ['deniz1.mp4', 'deniz2.mp4', 'deniz3.mp4', 'deniz4.mp4'];
        let isMusicPlaying = false;

        function toggleMetallica(event) {
            event.stopPropagation();
            if (isMusicPlaying) {
                bgMusic.pause();
                metaBtnText.innerText = "METALLICA BAŞLAT";
            } else {
                bgMusic.play();
                metaBtnText.innerText = "METALLICA DURDUR";
            }
            isMusicPlaying = !isMusicPlaying;
        }

        function playRandomVideo(event) {
            if(event) event.stopPropagation();
            bgMusic.pause();

            const randomIdx = Math.floor(Math.random() * videos.length);
            videoPlayer.src = videos[randomIdx]; 
            overlay.style.display = 'flex';
            videoPlayer.play().catch(e => console.log("Video hatasi:", e));
        }

        function handleScreenClick(event) {
            if (overlay.style.display === 'flex') return;
            playRandomVideo();
        }

        function closeVideo(event) {
            if(event) event.stopPropagation();
            overlay.style.display = 'none';
            videoPlayer.pause();
            videoPlayer.currentTime = 0;
            
            if (isMusicPlaying) {
                bgMusic.play();
            }
        }
    </script>
</body>
</html>

```
